services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: secure_t
      POSTGRES_USER: secure_t
      POSTGRES_PASSWORD: change-me-local-only
    ports: ["5432:5432"]
    volumes: [secure_t_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: secure-t-local
      MINIO_ROOT_PASSWORD: change-me-local-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [secure_t_minio:/data]
volumes:
  secure_t_pg:
  secure_t_minio:
