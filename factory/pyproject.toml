[project]
name = "securet-factory"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1", "pydantic>=2.7", "pydantic-settings>=2.2", "httpx>=0.27",
  "numpy>=1.26", "Pillow>=10.3", "fpdf2>=2.7",
  "edge-tts>=6.1", "PyYAML>=6.0", "tqdm>=4.66", "boto3>=1.34",
]
[project.optional-dependencies]
pdf-svg = ["cairosvg>=2.7"]
[project.scripts]
factory = "factory.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
